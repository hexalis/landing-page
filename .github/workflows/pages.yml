name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pages:
    uses: hexalis/github-workflows/.github/workflows/pages-static.yml@main
    with:
      package-manager: npm
      node-version: "24"
      install-command: npm ci
      build-command: npm run build
      output-path: dist
      site-url: https://hexalis.org
