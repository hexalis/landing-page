name: Validate

on: [push, pull_request]

permissions:
  contents: read
  pull-requests: write

jobs:
  ci:
    uses: hexalis/github-workflows/.github/workflows/node-ci.yml@main
    with:
      package-manager: npm
      node-version: "24"
      install-command: npm ci
      test-command: npm run verify
      build-command: npm run build
      e2e-install-command: npx playwright install --with-deps chromium
      e2e-command: npm run test:e2e
